x-base-php-app: &base_php_app
  build:
    context: ./docker/php
  image: ${COMPOSE_PROJECT_NAME}-php
  networks:
    - internal
    - external
  volumes:
    - &php-ini ${SERVER_HOME}/docker/php/etc/php/php.ini.${PHP_ENV}:/usr/local/etc/php/php.ini
    - &www-conf ${SERVER_HOME}/docker/php/etc/php-fpm.d/www.conf:/usr/local/etc/php-fpm.d/www.conf

networks:
  internal:
    external: false
  external:
    external: true

services:

  nginx:
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    image: nginx:1.25-alpine
    ports:
      - ${PORT_API_PROFILES}:80
      - ${PORT_API_QR_LINK}:81
    volumes:
      - ${SERVER_HOME}/docker/nginx/configs/nginx.conf:/etc/nginx/nginx.conf
      - ${SERVER_HOME}/docker/nginx/configs/htpasswd:/etc/nginx/htpasswd
      - ${SERVER_HOME}/docker/nginx/configs/conf.d:/etc/nginx/conf.d
      - ${SERVER_HOME}/docker/nginx/logs:/var/log/nginx
      - ${SERVER_HOME}/services:/var/www/services
    networks:
      - internal
      - external

  postgres:
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    image: postgres:18.1-alpine
    ports:
      - ${PORT_POSTGRES}:5432
    volumes:
      - ${SERVER_HOME}/docker/postgres/data:/var/lib/postgresql/data
      - ${SERVER_HOME}/docker/postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    networks:
      - internal
      - external

#============ PHP services ============#
  api-profiles:
    container_name: api-profiles
    <<: *base_php_app
    volumes:
      - *php-ini
      - *www-conf
      - ${SERVER_HOME}/services/api-profiles:/var/www

  api-qr-link:
    container_name: api-qr-link
    <<: *base_php_app
    volumes:
      - *php-ini
      - *www-conf
      - ${SERVER_HOME}/services/api-qr-link:/var/www

